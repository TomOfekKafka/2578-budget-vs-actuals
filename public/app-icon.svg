<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#4646CE"/>

  <!-- Bar chart bars: Budget (orange) vs Actuals (blue) side by side -->
  <!-- Category 1 -->
  <rect x="8" y="28" width="7" height="24" rx="2" fill="#f97316"/>
  <rect x="17" y="20" width="7" height="32" rx="2" fill="#3b82f6"/>

  <!-- Category 2 -->
  <rect x="28" y="18" width="7" height="34" rx="2" fill="#f97316"/>
  <rect x="37" y="24" width="7" height="28" rx="2" fill="#3b82f6"/>

  <!-- Category 3 -->
  <rect x="48" y="32" width="7" height="20" rx="2" fill="#f97316"/>
  <!-- (no actuals bar for cat 3 to keep it simple) -->

  <!-- Variance indicator line (green checkmark / trend) -->
  <polyline points="10,14 22,8 38,12 54,6" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="54" cy="6" r="2.5" fill="#10b981"/>

  <!-- Baseline -->
  <line x1="6" y1="52" x2="58" y2="52" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
</svg>
